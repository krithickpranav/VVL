<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101d32" />
    <meta name="description" content="Trip sheets, freight and driver settlements for Vetri Velavan Logistics." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VVL Accounts" />

    <title>Trip Accounts · Vetri Velavan Logistics</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/vetri-velavan-logo.jpeg" />
    <link rel="apple-touch-icon" href="/vetri-velavan-logo.jpeg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Critical: inline skeleton CSS so something renders instantly before JS loads -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #0d1829; }
      #root { min-height: 100vh; }
      /* Loading skeleton shown before React mounts */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
        background: #0d1829;
        color: #64748b;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
      }
      .app-loading-logo {
        width: 60px;
        height: 38px;
        border-radius: 6px;
        background: #1e2d45;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .app-loading-bar {
        width: 120px;
        height: 4px;
        border-radius: 4px;
        background: #1e2d45;
        overflow: hidden;
        position: relative;
      }
      .app-loading-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #3b6fd4, transparent);
        animation: shimmer 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loading skeleton while React bundle downloads -->
      <div class="app-loading">
        <div class="app-loading-logo"></div>
        <div class="app-loading-bar"></div>
        <span>Loading VVL Accounts…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
